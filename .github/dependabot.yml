version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directories:
      - /src/Telemetry.App
      - /src/Telemetry.Core
      - /tests/Telemetry.App.Tests
      - /tests/Telemetry.Core.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
