name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Source privacy guard
        shell: pwsh
        run: ./build/Check-Source.ps1
      - name: Locked restore and regression tests
        shell: pwsh
        run: |
          foreach ($project in @('Telemetry.Core.Tests', 'Telemetry.App.Tests')) {
            dotnet restore "tests/$project/$project.csproj" --locked-mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet test "tests/$project/$project.csproj" -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Self-contained portable build
        shell: pwsh
        run: ./build/Publish.ps1 -SkipInstaller
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Telemetry-win-x64
          path: |
            artifacts/Telemetry-*-win-x64.zip
            artifacts/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
